<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="minigpt-labs-title minigpt-labs-desc" id="minigpt-labs-root">
<title id="minigpt-labs-title">minigpt against the published pipelines of DeepSeek, Anthropic and OpenAI</title>
<desc id="minigpt-labs-desc">Three swimlanes, one per lab, with stages from pretraining through mid-training and SFT, preference learning and RL, to distillation, safety and checks. Boxes minigpt reproduces at toy scale are filled blue, partial ones have a blue outline, and stages minigpt does not reproduce are plain.</desc>
<defs>
<style>
#minigpt-labs-root .n { fill: #1f2328; font-size: 12px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; text-anchor: middle; }
#minigpt-labs-root .ln { fill: #1f2328; font-size: 14px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
#minigpt-labs-root .s { fill: #59636e; font-size: 9px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; text-anchor: middle; }
#minigpt-labs-root .sl { fill: #59636e; font-size: 9px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
#minigpt-labs-root .lbl { fill: #59636e; font-size: 8px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; text-anchor: middle; letter-spacing: 0.06em; }
#minigpt-labs-root .leg { fill: #59636e; font-size: 9px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
#minigpt-labs-root .mask { fill: #ffffff; }
#minigpt-labs-root .stage { fill: #ffffff; stroke: #1f2328; stroke-width: 1; }
#minigpt-labs-root .data { fill: #1f2328; fill-opacity: 0.05; stroke: #59636e; stroke-width: 1; }
#minigpt-labs-root .acc { fill: #0969da; fill-opacity: 0.08; stroke: #0969da; stroke-width: 1; }
#minigpt-labs-root .part { fill: #ffffff; stroke: #0969da; stroke-width: 1; }
#minigpt-labs-root .a { fill: none; stroke: #59636e; stroke-width: 1.2; marker-end: url(#minigpt-labs-arrow); }
</style>
<marker id="minigpt-labs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker>
</defs>
