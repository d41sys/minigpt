e">embeddings</text><text x="252" y="90" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">token + position</text><rect x="344" y="48" width="120" height="56" rx="6" fill="#ffffff"/><rect x="344" y="48" width="120" height="56" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1" fill-opacity="0.08"/><text x="404" y="74" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">block 1</text><text x="404" y="90" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">pre-LN</text><rect x="496" y="48" width="120" height="56" rx="6" fill="#ffffff"/><rect x="496" y="48" width="120" height="56" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1" fill-opacity="0.08"/><text x="556" y="74" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">… block N</text><text x="556" y="90" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">pre-LN</text><rect x="648" y="48" width="120" height="56" rx="6" fill="#ffffff"/><rect x="648" y="48" width="120" height="56" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="708" y="74" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">final LN</text><text x="708" y="90" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">LayerNorm</text><rect x="800" y="48" width="120" height="56" rx="6" fill="#ffffff"/><rect x="800" y="48" width="120" height="56" rx="6" fill="#ff