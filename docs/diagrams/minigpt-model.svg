<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="minigpt-model-title minigpt-model-desc" id="minigpt-model-root">
<title id="minigpt-model-title">minigpt model architecture</title>
<desc id="minigpt-model-desc">Text is BPE-tokenised, embedded, passed through N pre-LayerNorm transformer blocks (attention and MLP with residual adds) and a final LayerNorm, then an LM head tied to the token embedding gives next-token logits; a spam head reads the last non-pad token.</desc>
<defs>
      <style>#minigpt-model-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #minigpt-model-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#minigpt-model-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="minigpt-model-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker>
<marker id="minigpt-model-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
<marker id="minigpt-model-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
