<title id="minigpt-pipeline-title">minigpt training pipeline</title>
<desc id="minigpt-pipeline-desc">Pretraining on tiny-Shakespeare feeds the spam classifier and SFT on 900 Alpaca rows; the SFT model samples 300 rejected answers for DPO, and eval scores both SFT and DPO.</desc>
