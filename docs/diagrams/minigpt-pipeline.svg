<path class="a" d="M 384,104 L 384,168"/>
<path class="aa" d="M 464,196 L 496,196"/>
<rect class="mask" x="602" y="126" width="60" height="12" rx="2"/>
<text class="lbl" x="632" y="135">SFT SCORED</text>
<rect class="mask" x="40" y="48" width="120" height="56" rx="6"/>
<rect class="data" x="40" y="48" width="120" height="56" rx="6"/>
<text class="n" x="100" y="74">Shakespeare</text>
<text class="s" x="100" y="90">tiny, 1.1 MB</text>
<rect class="stage" x="192" y="48" width="120" height="56" rx="6"/>
<text class="n" x="252" y="74">pretrain</text>
<text class="s" x="252" y="90">5M params</text>
<rect class="stage" x="344" y="48" width="120" height="56" rx="6"/>
<text class="n" x="404" y="74">SFT</text>
<text class="s" x="404" y="90">Alpaca, 900 rows</text>
