<text class="n" x="556" y="74">300 samples</text>
<text class="s" x="556" y="90">rejected answers</text>
<rect class="mask" x="648" y="48" width="120" height="56" rx="6"/>
<rect class="acc" x="648" y="48" width="120" height="56" rx="6"/>
<text class="n" x="708" y="74">DPO</text>
<text class="s" x="708" y="90">vs frozen SFT ref</text>
<rect class="stage" x="800" y="48" width="120" height="56" rx="6"/>
<text class="n" x="860" y="74">eval</text>
<text class="s" x="860" y="90">ppl·EM·F1·judge</text>
<rect class="stage" x="192" y="168" width="120" height="56" rx="6"/>
<text class="n" x="252" y="194">spam classifier</text>
<text class="s" x="252" y="210">SMS Spam</text>
