      <style>#minigpt-pipeline-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #minigpt-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#minigpt-pipeline-root .diagram-container { overflow-x: visible; }
}</style>
