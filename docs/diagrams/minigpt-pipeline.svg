<svg viewBox="0 0 1280 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="minigpt-pipeline-title minigpt-pipeline-desc" id="minigpt-pipeline-root">
<title id="minigpt-pipeline-title">minigpt training pipeline</title>
<desc id="minigpt-pipeline-desc">Pretraining on tiny-Shakespeare gives a checkpoint used by the spam classifier and by SFT on 900 Alpaca rows; the SFT checkpoint samples 300 rejected answers for DPO, and eval scores both SFT and DPO.</desc>
