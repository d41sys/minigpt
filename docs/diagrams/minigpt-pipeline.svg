<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="minigpt-pipeline-title minigpt-pipeline-desc" id="minigpt-pipeline-root">
<title id="minigpt-pipeline-title">minigpt chat pipeline</title>
<desc id="minigpt-pipeline-desc">Pretraining on tiny-Shakespeare feeds the spam classifier and SFT on 900 Alpaca rows; the SFT model samples 300 rejected answers for DPO and also starts Constitutional AI (judge critique and revision, then DPO on judge preference labels); eval scores SFT and DPO.</desc>
<defs>
<style>
#minigpt-pipeline-root .n { fill: #1f2328; font-size: 12px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; text-anchor: middle; }
#minigpt-pipeline-root .s { fill: #59636e; font-size: 9px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; text-anchor: middle; }
#minigpt-pipeline-root .lbl { fill: #59636e; font-size: 8px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; text-anchor: middle; letter-spacing: 0.06em; }
#minigpt-pipeline-root .leg { fill: #59636e; font-size: 9px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
#minigpt-pipeline-root .mask { fill: #ffffff; }
#minigpt-pipeline-root .stage { fill: #ffffff; stroke: #1f2328; stroke-width: 1; }
#minigpt-pipeline-root .data { fill: #1f2328; fill-opacity: 0.05; stroke: #59636e; stroke-width: 1; }
#minigpt-pipeline-root .acc { fill: #0969da; fill-opacity: 0.08; stroke: #0969da; stroke-width: 1; }
#minigpt-pipeline-root .a { fill: none; stroke: #59636e; stroke-width: 1.2; marker-end: url(#minigpt-pipeline-arrow); }
#minigpt-pipeline-root .aa { fill: none; stroke: #0969da; stroke-width: 1.2; marker-end: url(#minigpt-pipeline-arrow-accent); }
</style>
<marker id="minigpt-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker>
<marker id="minigpt-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<path class="a" d="M 160,76 L 192,76"/>
<path class="a" d="M 312,76 L 344,76"/>
<path class="a" d="M 464,76 L 496,76"/>
<path class="aa" d="M 616,76 L 648,76"/>
<path class="a" d="M 768,76 L 800,76"/>
<path class="a" d="M 252,104 L 252,168"/>
