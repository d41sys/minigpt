<text class="n" x="556" y="194">CAI: RL</text>
<text class="s" x="556" y="210">DPO on judge A/B</text>
<line x1="40" y1="260" x2="920" y2="260" stroke="#1f2328" stroke-width="0.8" stroke-opacity="0.10"/>
<text x="40" y="280" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
<rect class="data" x="120" y="272" width="24" height="12" rx="2"/>
<text class="leg" x="152" y="281">data</text>
<rect class="stage" x="320" y="272" width="24" height="12" rx="2"/>
<text class="leg" x="352" y="281">stage</text>
<rect class="acc" x="520" y="272" width="24" height="12" rx="2"/>
<text class="leg" x="552" y="281">preference tuning</text>
</svg>
