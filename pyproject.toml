[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigpt"
version = "0.1.0"
description = "GPT from scratch: byte-level BPE, transformer model, pretraining, fine-tuning, SFT, and DPO"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tien-Dat Le" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy",
]

[project.urls]
Repository = "https://github.com/d41sys/minigpt"

[project.optional-dependencies]
hf = [
    "safetensors",
    "huggingface_hub",
]
test = [
    "transformers",
]

[project.scripts]
minigpt = "minigpt.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=2.4.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["slow: trains models / downloads data", "network: needs internet"]
addopts = "-m 'not slow and not network'"
